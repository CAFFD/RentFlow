server.address=127.0.0.1
spring.datasource.url=jdbc:postgresql://127.0.0.1:15432/${POSTGRES_DB:rentflow}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=3000
spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.virtual-host=rentflow
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS}
spring.rabbitmq.connection-timeout=3s
spring.rabbitmq.requested-heartbeat=10s
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.jackson.serialization.write-dates-as-timestamps=false
server.port=${PORT:8084}
spring.application.name=auditoria
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
rentflow.queue=auditoria.queue
rentflow.consumer-id=${WORKER_ID:auditoria}
